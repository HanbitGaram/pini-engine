/*
 * PiniEngine Android 빌드 (AGP 8 + ndk-build)
 *
 * 예전 proj.android 는 ant(build.xml) 프로젝트였고, proj.android-studio 는 게임 코드가 없는
 * cocos 순정 템플릿이었다(§5.1). 그래서 **ant 레이아웃을 그대로 둔 채** Gradle 을 얹었다.
 * 소스를 복제하지 않아 진실의 출처가 하나로 유지된다.
 *
 * 네이티브는 기존 jni/Android.mk 를 externalNativeBuild.ndkBuild 로 그대로 쓴다
 * (cocos 3.15 는 CMake 지원이 부실해서 ndk-build 가 최단 경로다).
 */
plugins {
    id 'com.android.application' version '8.6.1'
}

def cocosRoot = file('../../cocos2d-x').absolutePath
def gameRoot  = file('../../..')        // Engine/VisNovel — 게임 원본 src/res/config.json 이 있는 곳
def piniAssets = layout.buildDirectory.dir('generated/pini-assets')

/*
 * 리소스 동기화.
 *
 * 예전에는 `cocos compile` 이 build-cfg.json 의 copy_resources 를 읽어 src/res/config.json 을
 * proj.android/assets/ 로 복사해 줬다. 그 복사본이 저장소에 그대로 커밋돼 있는데,
 * 정작 src/(Lua 전체)가 빠져 있어서 그대로 패키징하면 엔진이 src/main.lua 를 못 찾고 죽는다.
 *
 * 그래서 assets 는 저장소의 복사본 대신 **원본에서 빌드 때마다 동기화한 디렉터리**를 쓴다.
 * 복사본이 원본과 어긋날 여지가 없어지고, build-cfg.json 과 동작이 일치한다.
 * (proj.android/assets/ 는 이제 쓰이지 않는 잔재다 — 정리는 사용자 판단에 맡긴다.)
 */
tasks.register('syncGameAssets', Sync) {
    description = 'build-cfg.json 의 copy_resources 를 그대로 수행한다'
    into piniAssets
    from("${gameRoot}/src") { into 'src' }
    from("${gameRoot}/res") { into 'res' }
    from("${gameRoot}/config.json")
}

// AGP 의 merge{Variant}Assets 보다 먼저 돌아야 한다.
tasks.matching { it.name ==~ /merge.*Assets/ }.configureEach { dependsOn 'syncGameAssets' }

android {
    namespace 'com.nooslab.pini_remote_landscape'
    compileSdk 35
    ndkVersion '27.1.12297006'

    defaultConfig {
        applicationId 'com.nooslab.pini_remote_landscape'
        minSdk 24
        targetSdk 35
        versionCode 56
        versionName '1.937'

        externalNativeBuild {
            ndkBuild {
                // cocos 의 Android.mk 들이 import-module 로 서로를 찾는 데 필요하다.
                // (예전에는 cocos 콘솔이 주입해 주던 값)
                arguments "NDK_MODULE_PATH=${cocosRoot}:${cocosRoot}/cocos:${cocosRoot}/external"
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        ndkBuild { path 'jni/Android.mk' }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            // 게임 자바 소스 + cocos2d-x 의 안드로이드 자바 런타임(Cocos2dxActivity 등)
            // cocos 의 Cocos2dxHelper 는 OBB 확장파일 읽기(zip_file 라이브러리)를 참조한다.
            // 확장파일 기능 자체는 안 쓰지만 컴파일에는 필요하므로 소스 경로만 붙여 준다
            // (cocos 소스를 고치지 않기 위해서다).
            java.srcDirs = ['src',
                            "${cocosRoot}/cocos/platform/android/java/src",
                            '../../android-extension/play_apk_expansion/zip_file/src']
            // AIDL v3 인앱결제 헬퍼(com.android.util.Iab*)는 제거 대상이다.
            // com.android.vending.billing.IInAppBillingService AIDL 에 의존하고, 그 방식 자체가
            // 폐기됐다. Play Billing 7+ 재작성은 후속 과제이고, 그 전까지 AppActivity 의
            // IAB_* 는 Lua 로 실패 콜백만 돌려주는 스텁이다.
            java.exclude '**/com/android/util/**'
            res.srcDirs = ['res']
            // Cocos2dxHelper 가 쓰는 com.enhance.gameservice.IGameTuningService 는 AIDL 이다.
            aidl.srcDirs = ["${cocosRoot}/cocos/platform/android/java/src"]
            // 위 syncGameAssets 가 원본에서 채워 넣는 디렉터리. 저장소의 assets/ 는 쓰지 않는다.
            assets.srcDirs = [piniAssets]
            // libs/ 에는 폐기한 광고 SDK jar 들과 32bit armeabi .so 가 남아 있다.
            // 네이티브는 externalNativeBuild 산출물만 쓰므로 여기서 끌어오지 않는다.
            jniLibs.srcDirs = []
        }
    }

    buildFeatures {
        aidl true   // 위 IGameTuningService.aidl 컴파일용 (AGP 8 부터는 기본 꺼짐)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    /*
     * 릴리스 서명.
     *
     * 예전에는 keystore 파일과 평문 비밀번호가 ant.properties 에 담겨 **저장소에 커밋**돼
     * 있었다(§5.5). 그 키는 손상된 것으로 보고 폐기했다.
     *
     * 새 키는 `scripts/make-release-keystore.sh` 로 발급하고, 설정은 커밋하지 않는
     * keystore.properties 나 환경변수로 넘긴다. 설정이 없으면 signingConfig 를 아예
     * 만들지 않으므로 debug 빌드는 키 없이도 그대로 된다.
     */
    def ksProps = new Properties()
    def ksFile = file('keystore.properties')
    if (ksFile.exists()) { ksFile.withInputStream { ksProps.load(it) } }

    def ksStore    = ksProps.getProperty('storeFile')     ?: System.getenv('PINI_KEYSTORE')
    def ksStorePwd = ksProps.getProperty('storePassword') ?: System.getenv('PINI_KEYSTORE_PASSWORD')
    def ksAlias    = ksProps.getProperty('keyAlias')      ?: System.getenv('PINI_KEY_ALIAS')
    def ksKeyPwd   = ksProps.getProperty('keyPassword')   ?: System.getenv('PINI_KEY_PASSWORD') ?: ksStorePwd
    def hasSigning = ksStore && ksStorePwd && ksAlias

    if (hasSigning) {
        signingConfigs {
            release {
                storeFile     file(ksStore)
                storePassword ksStorePwd
                keyAlias      ksAlias
                keyPassword   ksKeyPwd
            }
        }
    }

    buildTypes {
        debug   { minifyEnabled false }
        release {
            minifyEnabled false
            if (hasSigning) {
                signingConfig signingConfigs.release
            } else {
                // 서명 없이 assembleRelease 를 돌리면 설치 불가능한 unsigned APK 가 조용히
                // 나온다. 왜 그런지 알려 준다.
                gradle.taskGraph.whenReady { graph ->
                    if (graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
                        logger.warn('경고: 서명 설정이 없어 release APK 가 서명되지 않는다. ' +
                                    'scripts/make-release-keystore.sh 로 키를 발급할 것.')
                    }
                }
            }
        }
    }

    lint { abortOnError false }
}

dependencies {
    // AlarmReceive 의 NotificationCompat 용
    implementation 'androidx.core:core:1.13.1'

    // cocos 의 Cocos2dxDownloader 가 android-async-http 를 쓴다.
    // 예전에는 libs/ 에 jar 로 박혀 있었고, 그 jar 는 API 23 에서 클래스패스에서 빠진
    // Apache HttpClient 에 의존했다. 1.4.9 는 HttpClient 를 cz.msebera 로 리패키징해 담고 있어
    // 별도 조치 없이 최신 SDK 에서도 동작한다.
    implementation 'com.loopj.android:android-async-http:1.4.9'
}
